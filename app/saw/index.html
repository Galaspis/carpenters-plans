<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saw — ספריית נגרות</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#F7F7F6">
<link rel="icon" href="../brand/favicon.ico" sizes="any">
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../brand/apple-touch-icon.png?v=2">
<style>
  @font-face { font-family: Heebo; src: url('../brand/fonts/Heebo.ttf'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Nunito Sans'; src: url('../brand/fonts/NunitoSans.ttf'); font-weight: 200 900; font-display: swap; }
  :root { --ink:#202125; --accent:#F4512E; --accent-text:#B93920; --selected:#FFF0E9; --canvas:#EFF0F1; --bg:#F7F7F6; --panel:#FFFFFF; --muted:#60656C; --line:#DFE1E3; --oak:#D9B17C;
          --warn:#B93920; --ok:#2a7d4f; --soft:#F7F7F6; --r-control:10px; --r-panel:16px; --shadow:0 8px 28px rgb(32 33 37 / .08); }
  * { box-sizing: border-box; }
  html { direction: rtl; }
  body { margin:0; font-family: Heebo, 'Nunito Sans', Arial, sans-serif; font-size:16px; background:var(--bg); color:var(--ink); }
  button, input, select, textarea { font-family: inherit; font-size:15px; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
  a { color: var(--accent-text); }
  .ic { width:22px; height:22px; flex:none; vertical-align:middle; }

  header { height:72px; background:var(--panel); border-bottom:1px solid var(--line); padding:0 clamp(16px, 3vw, 32px); display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:35; }
  header .logo { height:40px; width:130px; object-fit:contain; display:block; }
  header .title { font-weight:800; font-size:20px; white-space:nowrap; }
  header .title small { font-weight:500; color:var(--muted); font-size:14px; margin-inline-start:8px; }
  header .hgroup { margin-inline-start:auto; display:flex; gap:6px; align-items:center; }
  .hbtn { background:transparent; color:var(--ink); border:1px solid transparent; border-radius:var(--r-control); min-height:44px; padding:6px 12px; font-size:15px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none; }
  .hbtn:hover { background:var(--soft); border-color:var(--line); }
  .syncdot { width:10px; height:10px; border-radius:50%; background:var(--ok); flex:none; } .syncdot[data-state=off] { background:var(--muted); } .syncdot[data-state=busy] { background:var(--oak); }

  main { max-width:1180px; margin:0 auto; padding:22px clamp(16px, 3vw, 32px) 80px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r-panel); padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .addrow { display:flex; gap:10px; flex-wrap:wrap; }
  .addrow input[type=url] { flex:1 1 320px; min-height:44px; padding:8px 14px; border:1px solid var(--line); border-radius:var(--r-control); direction:ltr; text-align:left; }
  .addrow textarea { width:100%; min-height:70px; padding:8px 14px; border:1px solid var(--line); border-radius:var(--r-control); resize:vertical; }
  .btn { min-height:44px; padding:8px 18px; border-radius:var(--r-control); border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; font-size:15px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
  .btn.primary:hover { background:#e2461f; border-color:#e2461f; }
  .btn.small { min-height:34px; padding:4px 12px; font-size:13px; font-weight:500; }
  .btn.ghost { border-color:transparent; background:transparent; }
  .btn:disabled { opacity:.5; cursor:default; }
  .muted { font-size:13px; color:var(--muted); }
  .hint { margin:10px 0 0; }
  .hint a { cursor:pointer; }
  .err { background:#FDECEA; color:var(--warn); border:1px solid #F5C6C0; border-radius:var(--r-control); padding:10px 14px; margin-top:10px; font-size:14px; }
  .err[hidden] { display:none; }

  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:4px 0 18px; }
  .filters input[type=search] { min-height:40px; padding:6px 12px; border:1px solid var(--line); border-radius:var(--r-control); flex:1 1 200px; max-width:320px; }
  .chip { border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 14px; font-size:14px; cursor:pointer; min-height:36px; }
  .chip[aria-pressed=true] { background:var(--selected); border-color:var(--accent); color:var(--accent-text); font-weight:600; }
  .chip.tag { font-size:13px; min-height:30px; padding:3px 10px; }
  .tagcloud { display:flex; gap:6px; flex-wrap:wrap; margin:-8px 0 18px; }
  .count { color:var(--muted); font-size:14px; margin-inline-start:auto; }

  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
  .item { background:#fff; border:1px solid var(--line); border-radius:var(--r-panel); overflow:hidden; position:relative; display:flex; flex-direction:column; transition: box-shadow .15s, border-color .15s; }
  .item:hover { box-shadow:var(--shadow); border-color:#cfd2d5; }
  .item .thumb { aspect-ratio: 4 / 3; background:var(--canvas); display:block; width:100%; object-fit:cover; cursor:pointer; }
  .item .thumb.ph { display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:40px; }
  .item .body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .item h3 { margin:0; font-size:17px; line-height:1.3; cursor:pointer; }
  .item h3.empty { color:var(--muted); font-weight:500; font-style:italic; }
  .item p { margin:0; font-size:14px; color:var(--muted); line-height:1.45; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .item .tags { display:flex; gap:5px; flex-wrap:wrap; }
  .item .tags span { font-size:12px; background:var(--soft); border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--ink); }
  .item .foot { display:flex; align-items:center; gap:6px; margin-top:auto; padding-top:6px; font-size:12px; color:var(--muted); }
  .item .foot .plat { font-weight:600; color:var(--accent-text); }
  .item .foot .sp { flex:1; }
  .item .star { position:absolute; top:8px; right:8px; border:none; background:rgba(255,255,255,.92); border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:17px; color:var(--muted); line-height:1; }
  .item .star[aria-pressed=true] { color:var(--accent); }
  .item .status { position:absolute; top:10px; left:10px; font-size:12px; font-weight:600; background:rgba(255,255,255,.92); border-radius:999px; padding:3px 10px; color:var(--ink); }
  .item .status[data-s=want] { color:var(--accent-text); } .item .status[data-s=done] { color:var(--ok); }
  .item.busy .thumb { opacity:.6; }
  .item .busytag { position:absolute; inset:auto 0 0 0; background:rgba(255,255,255,.95); font-size:13px; padding:6px 12px; text-align:center; color:var(--accent-text); font-weight:600; }
  .iconbtn { border:1px solid var(--line); background:var(--panel); border-radius:8px; width:34px; height:30px; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; color:var(--ink); }
  .iconbtn:hover { background:var(--soft); }
  .empty-state { text-align:center; color:var(--muted); padding:60px 20px; }
  .empty-state b { display:block; font-size:20px; color:var(--ink); margin-bottom:6px; }

  dialog { border:none; border-radius:var(--r-panel); padding:0; max-width:680px; width:calc(100% - 32px); box-shadow:0 20px 60px rgb(0 0 0 / .25); }
  dialog::backdrop { background:rgb(32 33 37 / .45); }
  dialog .dl { padding:22px 24px; display:flex; flex-direction:column; gap:12px; max-height:88vh; overflow:auto; }
  dialog h2 { margin:0; font-size:22px; }
  dialog img.big { width:100%; max-height:300px; object-fit:cover; border-radius:12px; background:var(--canvas); }
  dialog label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); font-weight:600; }
  dialog input, dialog textarea, dialog select { font-size:15px; font-weight:400; color:var(--ink); padding:8px 12px; border:1px solid var(--line); border-radius:var(--r-control); }
  dialog textarea { min-height:70px; resize:vertical; }
  dialog .row { display:flex; gap:10px; flex-wrap:wrap; } dialog .row > * { flex:1 1 160px; }
  dialog ul { margin:0; padding-inline-start:20px; font-size:14px; }
  dialog .sec b { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  dialog .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  dialog .actions .sp { flex:1; }
  .toast { position:fixed; bottom:20px; inset-inline-start:50%; transform:translateX(50%); background:var(--ink); color:#fff; border-radius:999px; padding:10px 20px; font-size:14px; z-index:50; box-shadow:var(--shadow); transition:opacity .3s; }
  .toast[hidden] { display:none; }
  @media (max-width:640px) {
    header .title small { display:none; }
    header .hbtn .t { display:none; }
    main { padding-top:14px; }
  }
</style>
</head>
<body>
<header>
  <a href="../" title="חזרה ל-Woody"><img class="logo" src="../brand/woody-header.svg" alt="Woody"></a>
  <span class="title">Saw <small>ספריית נגרות — פוסטים וסרטונים ששמרתם</small></span>
  <span class="hgroup">
    <a class="hbtn" href="../" title="תוכניות נגרות"><img class="ic" src="../brand/icons/assembly.svg" alt=""><span class="t">תוכניות</span></a>
    <span class="syncdot" id="syncDot" data-state="off" title="מסתנכרן"></span>
  </span>
</header>
<main>
  <section class="card">
    <form class="addrow" id="addForm" autocomplete="off">
      <input type="url" id="urlInput" placeholder="הדביקו קישור מפייסבוק, אינסטגרם, יוטיוב, טיקטוק או בלוג" required inputmode="url">
      <button class="btn primary" type="submit" id="addBtn"><img class="ic" src="../brand/icons/save.svg" alt="" style="filter:brightness(0) invert(1)">שמור</button>
      <textarea id="textInput" placeholder="לא חובה: הדביקו כאן את הכיתוב של הפוסט אם השרת לא מצליח לקרוא אותו" hidden></textarea>
    </form>
    <p class="muted hint">מהטלפון: בפוסט לחצו <b>שיתוף</b> ובחרו <b>Woody</b>. הקישור נפתח כאן ונשמר לבד. · <a id="toggleText">הדבקת כיתוב ידנית</a></p>
    <div class="err" id="addErr" hidden></div>
  </section>

  <div class="filters" id="filters">
    <input type="search" id="search" placeholder="חיפוש…">
    <button class="chip" data-type="" aria-pressed="true">הכל</button>
    <button class="chip" data-type="project">פרויקטים</button>
    <button class="chip" data-type="technique">טכניקות</button>
    <button class="chip" data-type="tool">כלים וג׳יגים</button>
    <button class="chip" data-type="material">חומרים וגימור</button>
    <button class="chip" data-type="inspiration">השראה</button>
    <button class="chip" data-status="want" aria-pressed="false">רוצה לבנות</button>
    <button class="chip" data-star="1" aria-pressed="false">★ מועדפים</button>
    <span class="count" id="count"></span>
  </div>
  <div class="tagcloud" id="tagcloud"></div>

  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty" hidden><b>הספרייה עדיין ריקה</b>שמרו את הפוסט הראשון: הדביקו קישור למעלה, או שתפו פוסט מהטלפון אל Woody.</div>
</main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script src="../vendor/gallab-store.js"></script>
<script src="saw.js"></script>
</body>
</html>
