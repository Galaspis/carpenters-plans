<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saw — ספריית נגרות</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#F7F7F6">
<link rel="icon" href="../brand/favicon.ico" sizes="any">
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../brand/apple-touch-icon.png?v=2">
<style>
  @font-face { font-family: Heebo; src: url('../brand/fonts/Heebo.ttf'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Nunito Sans'; src: url('../brand/fonts/NunitoSans.ttf'); font-weight: 200 900; font-display: swap; }
  :root { --ink:#202125; --accent:#F4512E; --accent-dark:#D9431F; --accent-text:#B93920; --selected:#FFF0E9; --canvas:#EFF0F1; --bg:#F7F7F6; --panel:#FFFFFF; --muted:#60656C; --line:#DFE1E3; --oak:#D9B17C;
          --warn:#B93920; --ok:#2a7d4f; --soft:#F7F7F6; --r-control:12px; --r-panel:18px; --shadow:0 8px 28px rgb(32 33 37 / .10); --shadow-sm:0 2px 10px rgb(32 33 37 / .08);
          --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { direction: rtl; }
  body { margin:0; font-family: Heebo, 'Nunito Sans', Arial, sans-serif; font-size:16px; background:var(--bg); color:var(--ink); min-height:100dvh; }
  button, input, select, textarea { font-family: inherit; font-size:15px; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
  a { color: var(--accent-text); }
  [hidden] { display:none !important; }
  .ic { width:22px; height:22px; flex:none; vertical-align:middle; }

  /* ---------- top bar (list view): Woody icon = back, Saw logo centred, like Kort's wordmark ---------- */
  header.top { background:var(--bg); padding:calc(var(--safe-top) + 10px) 16px 6px; display:grid; grid-template-columns:44px 1fr 44px; align-items:center; position:sticky; top:0; z-index:30; }
  header.top .backhome { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--panel); border:1px solid var(--line); }
  header.top .backhome img { height:30px; width:auto; display:block; }
  header.top .logo { height:64px; width:auto; max-width:60vw; justify-self:center; display:block; }
  .syncdot { width:9px; height:9px; border-radius:50%; background:var(--ok); justify-self:center; } .syncdot[data-state=off] { background:var(--muted); } .syncdot[data-state=busy] { background:var(--oak); }

  main { max-width:1100px; margin:0 auto; padding:14px 16px calc(var(--safe-bottom) + 110px); }

  /* ---------- search row ---------- */
  .searchrow { display:flex; gap:8px; align-items:center; }
  .search { flex:1; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:0 14px; min-height:46px; }
  .search input { flex:1; border:none; background:transparent; min-height:44px; font-size:16px; color:var(--ink); outline:none; min-width:0; }
  .search svg { width:20px; height:20px; color:var(--muted); flex:none; }
  .search .clear { border:none; background:transparent; color:var(--muted); font-size:18px; cursor:pointer; padding:4px; }
  .search { padding-inline-end:5px; min-height:54px; }
  .fbtn { width:42px; height:42px; border-radius:50%; border:none; background:var(--canvas); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .fbtn[aria-pressed=true] { background:var(--accent); color:#fff; }
  .fbtn svg { width:22px; height:22px; }
  .activefilter { display:flex; align-items:center; gap:10px; margin:12px 0 0; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.on::after { content:' ✕'; font-weight:400; opacity:.85; }
  .fsheet .grp { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .fsheet .grp b { font-size:13px; color:var(--muted); }
  .fsheet .wrap { display:flex; flex-wrap:wrap; gap:8px; }
  .fsheet .head { display:flex; align-items:center; justify-content:space-between; }
  .fsheet .scroll { max-height:60vh; overflow:auto; padding-bottom:6px; }

  .chip { flex:none; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:7px 14px; font-size:14px; font-weight:600; cursor:pointer; min-height:36px; color:var(--ink); white-space:nowrap; }
  .chip[aria-pressed=true] { background:var(--ink); border-color:var(--ink); color:#fff; }
  .chip.tag { font-weight:500; }
  .chip.withico { display:inline-flex; align-items:center; gap:6px; } .chip.withico svg { width:16px; height:16px; }
  .chip.tag[aria-pressed=true] { background:var(--accent); border-color:var(--accent); }
  .sectionhead { display:flex; align-items:baseline; gap:10px; margin:14px 0 10px; }
  .sectionhead h2 { margin:0; font-size:18px; font-weight:800; }
  .sectionhead .count { color:var(--muted); font-size:13px; }
  .sectionhead .clearf { margin-inline-start:auto; font-size:13px; color:var(--accent-text); background:none; border:none; cursor:pointer; }

  /* ---------- photo cards ---------- */
  .grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:12px; }
  @media (min-width:560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width:860px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .pcard { position:relative; border-radius:var(--r-panel); overflow:hidden; background:var(--canvas); aspect-ratio: 0.9; cursor:pointer; box-shadow:var(--shadow-sm); transform:translateZ(0); transition: transform .12s; isolation:isolate; }
  .pcard:active { transform:scale(.98); }
  .pcard img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .pcard .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:44px; color:#fff; background:linear-gradient(135deg, var(--oak), #b8864f); }
  .pcard .shade { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(20,12,8,0) 35%, rgba(20,12,8,.25) 60%, rgba(20,12,8,.86) 100%); pointer-events:none; }
  .pcard .text { position:absolute; inset:auto 0 0 0; padding:12px; color:#fff; display:flex; flex-direction:column; gap:4px; }
  .pcard h3 { margin:0; font-size:15px; line-height:1.3; font-weight:800; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-shadow:0 1px 2px rgb(0 0 0 / .4); }
  .pcard .meta { font-size:12px; opacity:.92; display:flex; gap:6px; align-items:center; }
  .pcard .heart { position:absolute; top:10px; left:10px; width:36px; height:36px; border-radius:50%; border:none; background:rgba(20,12,8,.45); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .pcard .heart svg { width:19px; height:19px; }
  .pcard .heart[aria-pressed=true] { color:#fff; } .pcard .heart[aria-pressed=true] svg path { fill:currentColor; }
  .featured .heart { width:50px; height:50px; } .featured .heart svg { width:28px; height:28px; }
  .pcard .pill { position:absolute; top:12px; right:12px; background:rgba(255,255,255,.92); color:var(--ink); font-size:11px; font-weight:700; border-radius:999px; padding:3px 9px; }
  .pcard .pill[data-s=want] { background:var(--accent); color:#fff; } .pcard .pill[data-s=done] { background:var(--ok); color:#fff; }
  .pcard .busy { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.55); font-weight:700; color:var(--accent-text); font-size:13px; text-align:center; padding:12px; }
  .pcard .busy::before { content:''; width:26px; height:26px; border:3px solid var(--accent); border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; position:absolute; top:calc(50% - 36px); }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* featured: newest item, full width */
  .featured { grid-column: 1 / -1; aspect-ratio: 1.25; }
  @media (min-width:560px) { .featured { aspect-ratio: 2.2; max-height:360px; } }
  .featured h3 { font-size:24px; -webkit-line-clamp:2; }
  .featured .text { padding:18px; gap:8px; }
  .featured .desc { font-size:14px; opacity:.92; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin:0; }
  .featured .typepill { align-self:flex-start; background:var(--accent); color:#fff; font-size:12px; font-weight:700; border-radius:999px; padding:4px 12px; }

  .empty-state { text-align:center; color:var(--muted); padding:60px 20px; }
  .empty-state b { display:block; font-size:20px; color:var(--ink); margin-bottom:6px; }

  /* ---------- add (floating button + sheet) ---------- */
  /* ---------- bottom tab bar, like Kort: four tabs and a raised + in the middle ---------- */
  .tabbar { position:fixed; inset:auto 0 0 0; z-index:25; background:var(--bg); border-top:1px solid var(--line); display:flex; align-items:flex-end; padding:6px 0 calc(var(--safe-bottom) + 6px); }
  .tabbar .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:2px; min-height:56px; padding:4px 0; background:none; border:none; cursor:pointer; color:var(--muted); font-size:11px; font-weight:600; text-decoration:none; }
  .tabbar .tab svg { width:24px; height:24px; }
  .tabbar .tab[aria-selected=true] { color:var(--accent); } .tabbar .tab[aria-selected=true] svg path { fill:currentColor; }
  .tabbar .tab.img img { width:26px; height:26px; object-fit:contain; display:block; }
  .tabbar .mid { flex:1; min-height:56px; }
  .tabbar .addwrap { position:absolute; top:-26px; left:0; right:0; display:flex; justify-content:center; pointer-events:none; }
  .tabbar .ring { position:absolute; top:-6px; width:76px; height:76px; border-radius:50%; background:var(--bg); }
  .tabbar .add { position:relative; width:64px; height:64px; border-radius:50%; border:none; background:var(--accent); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px rgb(244 81 46 / .4); pointer-events:auto; transition:transform .1s; }
  .tabbar .add:active { transform:scale(.94); }
  .tabbar .add svg { width:34px; height:34px; }
  .tabbar .add:hover { background:var(--accent-dark); }
  .sheet { position:fixed; inset:auto 0 0 0; background:var(--panel); border-radius:22px 22px 0 0; box-shadow:0 -10px 40px rgb(0 0 0 / .18); padding:14px 18px calc(var(--safe-bottom) + 18px); z-index:48; transform:translateY(105%); transition:transform .22s ease; max-width:720px; margin:0 auto; }
  .sheet.open { transform:none; }
  .sheet .grab { width:42px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px; }
  .sheet h2 { margin:0 0 10px; font-size:20px; }
  .sheet input[type=url], .sheet textarea { width:100%; min-height:48px; padding:10px 14px; border:1px solid var(--line); border-radius:var(--r-control); font-size:16px; }
  .sheet input[type=url] { direction:ltr; text-align:left; }
  .sheet textarea { min-height:80px; resize:vertical; margin-top:8px; }
  .sheet .row { display:flex; gap:8px; margin-top:10px; align-items:center; }
  .scrim { position:fixed; inset:0; background:rgb(32 33 37 / .4); z-index:47; opacity:0; pointer-events:none; transition:opacity .2s; }
  .scrim.open { opacity:1; pointer-events:auto; }
  .btn { min-height:46px; padding:8px 18px; border-radius:var(--r-control); border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; font-size:15px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }
  .btn svg { width:20px; height:20px; flex:none; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.primary:hover { background:var(--accent-dark); }
  .btn.ghost { border-color:transparent; background:transparent; }
  .btn.danger { color:var(--warn); }
  .btn.block { width:100%; }
  .btn:disabled { opacity:.5; cursor:default; }
  .muted { font-size:13px; color:var(--muted); }
  .err { background:#FDECEA; color:var(--warn); border:1px solid #F5C6C0; border-radius:var(--r-control); padding:10px 14px; margin-top:10px; font-size:14px; }

  /* ---------- detail view ---------- */
  #detail { position:fixed; inset:0; background:var(--bg); z-index:45; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .hero { position:relative; height:min(62vw, 420px); min-height:260px; background:var(--canvas); }
  .hero img { width:100%; height:100%; object-fit:cover; display:block; }
  .hero .ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:96px; color:#fff; background:linear-gradient(135deg, var(--oak), #b8864f); }
  .hero .shade { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,.4), rgba(0,0,0,0) 45%); pointer-events:none; }
  .herobar { position:absolute; top:calc(var(--safe-top) + 10px); inset-inline:12px; display:flex; gap:8px; }
  .herobar .sp { flex:1; }
  .cbtn { width:44px; height:44px; border-radius:50%; border:none; background:rgba(255,255,255,.92); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); font-size:18px; text-decoration:none; }
  .cbtn svg { width:22px; height:22px; }
  .cbtn.on { color:var(--accent); } .cbtn.on svg path { fill:currentColor; }
  .play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:68px; height:68px; border-radius:50%; background:rgba(20,12,8,.55); border:2px solid rgba(255,255,255,.85); display:flex; align-items:center; justify-content:center; color:#fff; text-decoration:none; }
  .play svg { width:30px; height:30px; margin-inline-start:-3px; }
  .dsheet { background:var(--bg); border-radius:24px 24px 0 0; margin-top:-24px; position:relative; padding:22px 18px calc(var(--safe-bottom) + 110px); max-width:820px; margin-inline:auto; }
  .dsheet h1 { margin:0 0 8px; font-size:26px; line-height:1.25; font-weight:900; }
  .dsheet .lead { margin:0 0 14px; color:var(--muted); font-size:16px; line-height:1.55; }
  .metarow { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:14px; color:var(--ink); }
  .metarow .m { display:flex; align-items:center; gap:6px; } .metarow .m svg { width:17px; height:17px; color:var(--muted); }
  .metarow .div { width:1px; height:18px; background:var(--line); }
  .statusrow { display:flex; gap:8px; padding:12px 0 2px; flex-wrap:wrap; }
  .statusrow .chip[aria-pressed=true] { background:var(--accent); border-color:var(--accent); }
  .dtags { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 2px; }
  .dtags button { font-size:13px; background:var(--selected); color:var(--accent-text); border:none; border-radius:999px; padding:4px 11px; cursor:pointer; font-weight:600; }
  .tabs { display:flex; border-bottom:1px solid var(--line); margin:12px 0 14px; }
  .tabs button { flex:1; background:none; border:none; border-bottom:3px solid transparent; padding:12px 4px; font-size:15px; font-weight:700; color:var(--muted); cursor:pointer; margin-bottom:-1px; }
  .tabs button[aria-selected=true] { color:var(--ink); border-bottom-color:var(--accent); }
  .panel ul { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
  .panel li { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:15px; line-height:1.5; display:flex; gap:12px; }
  .panel li .n { flex:none; width:28px; height:28px; border-radius:50%; background:var(--selected); color:var(--accent-text); font-weight:800; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .panel h4 { margin:14px 0 8px; font-size:14px; color:var(--muted); font-weight:700; }
  .panel .none { color:var(--muted); font-size:14px; padding:12px 0; }
  .panel textarea { width:100%; min-height:120px; border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:15px; resize:vertical; background:var(--panel); }
  .panel details { margin-top:10px; } .panel summary { cursor:pointer; color:var(--muted); font-size:14px; }
  .panel .caption { white-space:pre-wrap; font-size:14px; color:var(--muted); line-height:1.5; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:8px; }
  .dock { position:fixed; inset:auto 0 0 0; padding:10px 16px calc(var(--safe-bottom) + 12px); background:linear-gradient(to top, var(--bg) 70%, rgba(247,247,246,0)); display:flex; gap:10px; z-index:46; max-width:820px; margin:0 auto; }
  .dock .btn { flex:1; }
  /* ---------- action sheet (the "⋯" menu), like Kort ---------- */
  .asheet { z-index:48; }
  .asheet h3 { margin:0 0 2px; font-size:17px; text-align:center; font-weight:800; }
  .asheet .sub { text-align:center; margin:0 0 8px; }
  .asheet .arow { display:flex; align-items:center; gap:14px; padding:10px 8px; border-radius:14px; background:none; border:none; width:100%; cursor:pointer; font-size:16px; font-weight:700; color:var(--ink); text-align:start; }
  .asheet .arow:hover, .asheet .arow:active { background:var(--canvas); }
  .asheet .arow .tile { width:40px; height:40px; border-radius:12px; background:var(--canvas); display:flex; align-items:center; justify-content:center; flex:none; color:var(--ink); }
  .asheet .arow .tile svg { width:20px; height:20px; }
  .asheet .arow.danger { color:var(--warn); } .asheet .arow.danger .tile { background:var(--warn); color:#fff; }
  .asheet .arow.wa .tile { background:#25D366; color:#fff; }
  .asheet .cancel { margin-top:6px; }

  /* ---------- edit dialog ---------- */
  dialog { border:none; border-radius:var(--r-panel); padding:0; max-width:640px; width:calc(100% - 24px); box-shadow:0 20px 60px rgb(0 0 0 / .25); }
  dialog::backdrop { background:rgb(32 33 37 / .45); }
  dialog form { padding:20px 20px; display:flex; flex-direction:column; gap:12px; max-height:88vh; overflow:auto; }
  dialog h2 { margin:0; font-size:20px; }
  dialog label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); font-weight:700; }
  dialog input, dialog textarea, dialog select { font-size:16px; font-weight:400; color:var(--ink); padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-control); background:var(--panel); }
  dialog textarea { min-height:80px; resize:vertical; }
  dialog .row2 { display:flex; gap:10px; } dialog .row2 > * { flex:1; }
  dialog .actions { display:flex; gap:8px; margin-top:4px; }
  .toast { position:fixed; bottom:calc(var(--safe-bottom) + 100px); inset-inline-start:50%; transform:translateX(50%); background:var(--ink); color:#fff; border-radius:999px; padding:10px 20px; font-size:14px; z-index:60; box-shadow:var(--shadow); }
  @media (min-width:700px) {
    header.top .logo { height:40px; width:130px; }
    .tabbar { max-width:720px; margin:0 auto; border:1px solid var(--line); border-bottom:none; border-radius:22px 22px 0 0; }
  }
</style>
</head>
<body>
<div id="list">
  <header class="top">
    <a class="backhome" href="../" title="חזרה ל-Woody"><img src="../brand/woody-symbol.svg" alt="Woody"></a>
    <img class="logo" src="../brand/saw-header.svg" alt="Saw">
  </header>
  <main>
    <div class="searchrow">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="חיפוש לפי שם, תגית, חומר או כלי…" autocomplete="off">
        <button class="clear" id="clearSearch" type="button" hidden aria-label="נקה">✕</button>
        <button class="fbtn" id="filterBtn" type="button" aria-pressed="false" title="סינון"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>
      </label>
    </div>
    <div class="activefilter" id="activeFilter" hidden><span class="muted">מסונן לפי</span><button class="chip on" id="activeChip"></button><span class="muted" id="activeCount"></span></div>
    <div class="sectionhead"><h2 id="secTitle">הספרייה</h2><span class="count" id="count"></span><button class="clearf" id="clearFilters" hidden>נקה סינון</button></div>
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="empty" hidden><b>הספרייה עדיין ריקה</b>שמרו את הפוסט הראשון: לחצו על <b>+ קישור</b>, או שתפו פוסט מהטלפון אל Saw.</div>
  </main>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-key="" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h3v15H5a1 1 0 0 1-1 0zM9 19V4h4v15zM14 18.5 16.5 4l3.5.7L17.5 19z"/></svg>הספרייה</button>
    <button class="tab" data-key="want" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5 20.5 9.5 9 21H3v-6zM12 6l6 6"/></svg>רוצה לבנות</button>
    <span class="mid"></span>
    <button class="tab" data-key="star" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z"/></svg>מועדפים</button>
    <a class="tab img" href="../"><img src="../brand/woody-symbol.svg" alt="">Woody</a>
    <div class="addwrap"><span class="ring"></span><button class="add" id="fab" title="שמירת פוסט"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
  </nav>
</div>

<div id="detail" hidden></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet fsheet" id="fsheet">
    <div class="grab"></div>
    <div class="head"><h2 style="margin:0">סינון</h2><button class="btn ghost" type="button" id="fClear" hidden>ניקוי</button></div>
    <div class="scroll" id="fBody"></div>
  </div>
  <div class="sheet asheet" id="asheet"></div>
  <form class="sheet" id="sheet" autocomplete="off">
    <div class="grab"></div>
    <h2>שמירת פוסט</h2>
    <input type="url" id="urlInput" placeholder="הדביקו קישור מפייסבוק, אינסטגרם, יוטיוב, טיקטוק או בלוג" required inputmode="url">
    <textarea id="textInput" placeholder="לא חובה: הכיתוב של הפוסט, אם השרת לא מצליח לקרוא אותו" hidden></textarea>
    <div class="row">
      <button class="btn primary" type="submit" style="flex:1">שמור וסכם</button>
      <button class="btn ghost" type="button" id="toggleText">+ כיתוב</button>
    </div>
    <p class="muted" style="margin:10px 0 0">מהטלפון: בפוסט לחצו <b>שיתוף</b> ובחרו <b>Saw</b>. הקישור נשמר לבד.</p>
    <div class="err" id="addErr" hidden></div>
  </form>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>
